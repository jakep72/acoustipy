[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoustipy"]

[project]
name = "acoustipy"
version = "0.1.0"
authors = [
  { name="Jacob Peterson", email="jdpeterman72@gmail.com" },
]
description = "Tools for characterizing the acoustic performance of porous materials."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
keywords = ["acoustics", "porous materials", "transfer matrix", "absorption", "impedance tube"]

# Core dependencies - torch from PyPI is CPU-only by default
# For GPU support, users should install torch separately from pytorch.org
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "torch>=2.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage-lcov>=0.2.4",
]

# Documentation dependencies
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings-python>=1.7.0",
]

# All optional dependencies
all = [
    "acoustipy[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/jakep72/acoustipy"
Documentation = "https://jakep72.github.io/acoustipy/"
Repository = "https://github.com/jakep72/acoustipy"
Issues = "https://github.com/jakep72/acoustipy/issues"
Changelog = "https://github.com/jakep72/acoustipy/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["acoustipy"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
